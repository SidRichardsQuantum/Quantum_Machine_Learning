name: Refresh results

on:
  push:
    branches:
      - main
    paths:
      - notebooks/**
      - src/**
      - docs/pages/generate_results.py
      - pyproject.toml
      - requirements.txt
      - .github/workflows/refresh-results.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install documentation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute notebooks and refresh result pages
        run: python docs/pages/generate_results.py --execute-notebooks

      - name: Restore executed notebooks
        run: git restore notebooks

      - name: Commit refreshed result artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results docs/pages/assets/reference-results docs/pages/assets/notebook-results
          if git diff --cached --quiet; then
            echo "No result artifact changes to commit."
          else
            git commit -m "Refresh generated result artifacts"
            git push
          fi
