name: Refresh results

on:
  push:
    branches:
      - main
    paths:
      - notebooks/**
      - src/qml/*.py
      - docs/pages/generate_results.py
      - pyproject.toml
      - requirements.txt
      - .github/workflows/refresh-results.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install documentation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Determine refresh scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          full_refresh_pattern='^(src/qml/[^/]+\.py|docs/pages/generate_results\.py|pyproject\.toml|requirements\.txt|\.github/workflows/refresh-results\.yml)$'
          full_refresh_files="$(
            printf '%s\n' "$changed_files" \
              | grep -E "$full_refresh_pattern" \
              || true
          )"

          if [ -n "$full_refresh_files" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          notebooks="$(
            printf '%s\n' "$changed_files" \
              | grep -E '^notebooks/.+\.ipynb$' \
              || true
          )"

          if [ -z "$notebooks" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "mode=notebooks"
            echo "notebooks<<EOF"
            printf '%s\n' "$notebooks"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Execute notebooks and refresh result pages
        if: steps.scope.outputs.mode == 'all'
        run: python docs/pages/generate_results.py --execute-notebooks

      - name: Execute changed notebooks and refresh result pages
        if: steps.scope.outputs.mode == 'notebooks'
        shell: bash
        run: |
          args=()
          while IFS= read -r notebook; do
            if [ -f "$notebook" ]; then
              args+=(--execute-notebook "$notebook")
            fi
          done <<< "${{ steps.scope.outputs.notebooks }}"
          python docs/pages/generate_results.py --skip-api-results "${args[@]}"

      - name: Restore executed notebooks
        if: steps.scope.outputs.mode != 'none'
        run: git restore notebooks

      - name: Commit refreshed result artifacts
        if: steps.scope.outputs.mode != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/results \
            docs/pages/assets/reference-results \
            docs/pages/assets/notebook-results
          if git diff --cached --quiet; then
            echo "No result artifact changes to commit."
          else
            git commit -m "Refresh generated result artifacts"
            git push
          fi
