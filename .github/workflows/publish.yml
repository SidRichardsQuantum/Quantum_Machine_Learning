name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  wait-for-tests:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Wait for Tests workflow on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            run="$(
              gh run list \
                --workflow Tests \
                --commit "$HEAD_SHA" \
                --event push \
                --limit 20 \
                --json databaseId,status,conclusion \
                --jq 'map(select(.status == "completed")) | .[0] // empty'
            )"

            if [ -n "$run" ]; then
              conclusion="$(printf '%s' "$run" | jq -r '.conclusion')"
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "Tests workflow completed with conclusion: $conclusion"
              exit 1
            fi

            echo "Waiting for Tests workflow for $HEAD_SHA, attempt $attempt..."
            sleep 20
          done

          echo "Timed out waiting for Tests workflow for $HEAD_SHA."
          exit 1

      - name: Manual publish bypasses workflow ordering
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual publish dispatch requested; continuing without waiting for Tests."

  build:
    runs-on: ubuntu-latest
    needs: wait-for-tests

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
