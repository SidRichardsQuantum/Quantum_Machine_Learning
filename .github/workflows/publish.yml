name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  wait-for-release-checks:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Wait for successful Tests and Pages workflows on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          wait_for_workflow() {
            workflow="$1"
            event="$2"

            for attempt in $(seq 1 60); do
              run="$(
              gh run list \
                --workflow "$workflow" \
                --commit "$HEAD_SHA" \
                --event "$event" \
                --limit 20 \
                --json databaseId,status,conclusion \
                --jq 'map(select(.status == "completed")) | .[0] // empty'
              )"

              if [ -n "$run" ]; then
                conclusion="$(printf '%s' "$run" | jq -r '.conclusion')"
                if [ "$conclusion" = "success" ]; then
                  return 0
                fi
                echo "$workflow workflow completed with conclusion: $conclusion"
                return 1
              fi

              echo "Waiting for $workflow workflow for $HEAD_SHA, attempt $attempt..."
              sleep 20
            done

            echo "Timed out waiting for $workflow workflow for $HEAD_SHA."
            return 1
          }

          wait_for_workflow Tests push
          wait_for_workflow Pages workflow_run

  build:
    runs-on: ubuntu-latest
    needs: wait-for-release-checks

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
