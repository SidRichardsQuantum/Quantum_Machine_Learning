[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-pennylane"
version = "0.2.4"
description = "Modular PennyLane-based quantum machine learning suite for classification, regression, and quantum kernel methods."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sid Richards" }
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pennylane>=0.34",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.scripts]
qml-pennylane = "qml.cli:main"

[project.urls]
Homepage = "https://github.com/SidRichardsQuantum/Quantum_Machine_Learning"
Repository = "https://github.com/SidRichardsQuantum/Quantum_Machine_Learning"
Issues = "https://github.com/SidRichardsQuantum/Quantum_Machine_Learning/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "black",
    "ruff",
    "ipykernel",
    "nbconvert",
    "nbformat",
    "markdown",
    "pymdown-extensions",
    "tomli>=2; python_version < '3.11'",
    "build",
    "twine",
    "jupytext",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: slower end-to-end tests kept in the full test pass",
]

[tool.ruff]
line-length = 100
exclude = [
    "notebooks",
]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "notebooks"
